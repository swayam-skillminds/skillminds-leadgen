[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "leadscraper"
description = "Failure-tolerant B2B lead generation from free public sources"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    # Core HTTP + parsing
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "brotli>=1.1.0",          # so we can honestly advertise 'br' to servers
    "lxml>=5.1.0",
    # Headless browser (Google Maps + JS-heavy directories)
    "playwright>=1.44.0",
    # Normalisation / matching
    "phonenumbers>=8.13.0",
    "rapidfuzz>=3.6.0",
    # Resilience
    "tenacity>=8.2.0",
    # Config
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    # Google Sheets (free tier of the Sheets API)
    "gspread>=6.0.0",
    "google-auth>=2.28.0",
    # Excel workbooks (tools/build_*_workbook.py; the Phase 4 exporter)
    "openpyxl>=3.1.0",
    # Persistence: one schema for SQLite (local, WAL) and Postgres (server)
    "SQLAlchemy>=2.0.30",
    "alembic>=1.13",
    # Run-config schema (validation + JSON Schema for the future UI)
    "pydantic>=2.6",
    # Cross-platform data/config/cache locations
    "platformdirs>=4.0",
    # Registrable domains for identity matching (bundled suffix list, no fetch)
    "tldextract>=5.1",
    # Keep the machine awake while a run is active (macOS, Windows, Linux)
    "wakepy>=0.9",
    # The HTTP API (Phase 3): FastAPI + an ASGI server; multipart for uploads
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    # Secrets in the OS keychain in local mode (env / secret files in server mode)
    "keyring>=25",
    # IANA timezones for schedules; Windows ships no tz database of its own
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# The Anthropic provider of the AI layer (Phase 5) uses the official SDK. The
# other providers (OpenAI, Gemini, OpenAI-compatible) speak plain HTTP through
# `requests`, and the `claude` CLI provider needs no Python package.
ai = ["anthropic>=1.11"]
# Server mode on Postgres.
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0.0", "httpx>=0.27", "ruff>=0.6", "anthropic>=1.11"]

[project.scripts]
leadscraper = "leadscraper.cli:main"

[tool.setuptools.dynamic]
version = { attr = "leadscraper.__version__" }

[tool.setuptools.packages.find]
include = ["leadscraper*"]

[tool.setuptools.package-data]
"leadscraper.db" = ["alembic.ini", "migrations/*.py", "migrations/versions/*.py"]
"leadscraper.ai" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real network; opt-in only (pytest -m live)",
    "characterisation: pins current behaviour against frozen baselines",
    "postgres: needs LEADSCRAPER_TEST_POSTGRES_URL (a throwaway Postgres); skipped otherwise",
    "browser: launches headless Chromium against a local fixture server (skipped without it)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
extend-exclude = ["leadscraper/db/migrations/versions"]

[tool.ruff.lint]
# Errors and likely bugs; style (line length) is not enforced.
select = ["E4", "E7", "E9", "F", "W", "B"]
ignore = [
    "E741",   # `l` in comprehensions
    "B027",   # optional no-op hooks on the lead-type session ABC are intended
    "B905",   # zip() without strict= (3.10+ only; lengths are checked where it matters)
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters with these in defaults; they are not mutable state.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.File",
                          "fastapi.Form", "fastapi.Header", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "B904"]     # sys.path set-up before imports; test doubles
"tools/**" = ["B023"]             # cell writers defined and called inside one loop pass
