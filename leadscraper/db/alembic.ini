# Alembic configuration for the leadscraper application database.
#
# The code sets script_location and the URL itself (leadscraper/db/engine.py),
# so migrations run the same from the CLI, the API and the tests:
#
#   python -m leadscraper db upgrade                 # LEADSCRAPER_DB_URL or the default DB
#   python -m leadscraper db upgrade --sql            # print the SQL instead (e.g. for Postgres)

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
