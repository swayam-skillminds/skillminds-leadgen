# The offline test suite on macOS, Windows and Linux (APP-BUILD-PROMPT A.3, Phase 2).
# Phase 3 extends this with lint, a Playwright smoke test and the bundle round trip.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests (offline; live deselected, Postgres skipped)
        run: python -m pytest tests -q
