# CI (APP-BUILD-PROMPT A.3, Phase 3.6), on macOS, Windows and Linux:
#   lint          ruff
#   test          the offline suite, plus a headless Chromium smoke test against a local
#                 fixture server (Playwright browsers installed, so it must not skip)
#   bundle-*      a bundle made on each OS is imported on every OS
#   docker        `docker compose up` builds, starts API + worker, and passes /health
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.6"
      - run: ruff check leadscraper tests tools run.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    env:
      LEADSCRAPER_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Chromium (Linux, with system libraries)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Chromium
        if: runner.os != 'Linux'
        run: python -m playwright install chromium
      - name: Tests (offline; live deselected, Postgres skipped)
        run: python -m pytest tests -q

  bundle-make:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python tools/ci_bundle.py make bundles
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ runner.os }}
          path: bundles/

  bundle-check:
    needs: bundle-make
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: bundles
      - name: Import every OS's bundle here
        run: python tools/ci_bundle.py check bundles

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: docker compose up
        run: docker compose up -d --build
      - name: /health passes, with the worker alive
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health -o health.json; then
              if python3 -c "import json,sys; h=json.load(open('health.json')); sys.exit(0 if h['checks']['worker']['status']=='ok' else 1)"; then
                break
              fi
            fi
            sleep 5
          done
          cat health.json
          python3 - <<'EOF'
          import json
          health = json.load(open("health.json"))
          checks = health["checks"]
          assert health["status"] in ("ok", "degraded"), health["status"]
          assert checks["database"]["status"] == "ok", checks["database"]
          assert checks["browser"]["status"] == "ok", checks["browser"]
          assert checks["worker"]["status"] == "ok", checks["worker"]
          print("health:", health["status"], {k: v["status"] for k, v in checks.items()})
          EOF
          curl -fsS http://127.0.0.1:8000/api/v1/openapi.json -o /dev/null
      - name: Logs
        if: always()
        run: docker compose logs --no-color | tail -200
      - name: docker compose down
        if: always()
        run: docker compose down -v
